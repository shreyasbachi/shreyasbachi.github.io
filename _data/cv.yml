- title: Research Experience
  type: time_table
  contents:
    - title: Research Intern — Data Mining & Reinforcement Learning Lab
      institution: Arizona State University (Prof. Hua Wei)
      year: Sept 2024 - Dec 2025
      description:
        - Built a PyTorch–ONNX–TensorRT mixed-precision pipeline for real-time depth estimation on Jetson Nano, reducing latency by 33%, shrinking model size by 42%, and increasing throughput by 50% while retaining 99% baseline accuracy.
        - Designed a dataset-distillation method for RL using a bi-level meta-learning pipeline in PyTorch, compressing a 100K-step PPO trajectory into 50 synthetic states and retaining 96% of expert policy performance.
        - Contributed to JL-GAT for sim-to-real multi-agent traffic control (RLC 2025) and a survey on generative AI in transportation planning.
    - title: Research Intern — ASU Center for Semiconductor Microelectronics (ACME)
      institution: Arizona State University (Prof. Krishnendu Chakrabarty)
      year: June 2025 - Aug 2025
      description:
        - Profiled Mixtral-8×7B MoE inference on GPU–CPU systems using NVML, RAPL, and CUDA; built a thread-safe expert-swapping pipeline with explicit GPU memory management, pinned-host transfers, and CUDA stream scheduling.
        - Identified memory swapping as the primary bottleneck (~60% of energy and latency overhead); proposed an energy- and residency-aware routing policy to prefetch non-resident experts into GPU memory.

